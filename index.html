<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EISE Clicker 🌼</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px 12px;
    font-family: "Trebuchet MS", sans-serif;
    background: linear-gradient(145deg, #fff9e9, #fff1c9, #fffaf0);
    color: #806b42;
}

.container {
    width: 100%;
    max-width: 440px;
    text-align: center;
}

h1 {
    margin-bottom: 5px;
    color: #d5aa4b;
    font-size: 30px;
    letter-spacing: 3px;
}

.subtitle {
    margin-top: 0;
    color: #a99770;
    font-size: 13px;
}

.keychain {
    position: relative;
    margin: 55px auto 25px;
    padding: 35px 12px 25px;
    width: 100%;
    max-width: 390px;
    border: 5px solid #e8d5a6;
    border-radius: 35px;
    background: linear-gradient(145deg, #fffdf5, #f8edcf);
    box-shadow:
        0 12px 0 #d9c391,
        0 18px 25px rgba(128, 105, 57, 0.15),
        inset 0 3px 8px white;
}

.keyring {
    position: absolute;
    top: -48px;
    left: 50%;
    transform: translateX(-50%);
    width: 55px;
    height: 55px;
    border: 7px solid #c9c9c9;
    border-radius: 50%;
    box-shadow: inset 0 2px 5px white, 0 2px 5px #aaa;
}

.keyring::after {
    content: "";
    position: absolute;
    width: 14px;
    height: 18px;
    background: #c9c9c9;
    left: 50%;
    bottom: -20px;
    transform: translateX(-50%);
    border-radius: 4px;
}

.decorations {
    position: absolute;
    top: -20px;
    left: 17px;
    right: 17px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    pointer-events: none;
}

.hairpin {
    position: relative;
    width: 43px;
    height: 10px;
    border-radius: 20px;
    background: linear-gradient(90deg, #e9b94f, #ffe8a3);
    box-shadow: 0 2px 3px #cbb477;
    transform: rotate(-18deg);
}

.hairpin::before {
    content: "";
    position: absolute;
    width: 13px;
    height: 13px;
    top: -2px;
    left: 5px;
    border: 2px solid #fff8df;
    border-radius: 50%;
}

.hairpin.second {
    width: 38px;
    height: 10px;
    background: linear-gradient(90deg, #fff, #f3d98e);
    transform: rotate(18deg);
}

.hairpin.second::before {
    content: "✿";
    position: absolute;
    left: 3px;
    top: -9px;
    color: #d9ad4d;
    font-size: 15px;
    border: none;
}

.label {
    margin: 4px 0 18px;
    color: #b99a58;
    font-size: 12px;
    letter-spacing: 2px;
    font-weight: bold;
}

.buttons {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 7px;
    align-items: center;
}

.key {
    width: 100%;
    aspect-ratio: 1;
    min-width: 0;
    border: none;
    border-radius: 16px;
    cursor: pointer;
    font-size: clamp(17px, 5vw, 24px);
    font-weight: bold;
    color: #92723b;
    background: linear-gradient(145deg, #fff9df, #efd78e);
    box-shadow:
        0 7px 0 #d7bd78,
        0 9px 12px rgba(134, 102, 39, 0.13),
        inset 0 3px 5px white;
    transition: transform 0.08s, box-shadow 0.08s;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
}

.key:nth-child(2) {
    background: linear-gradient(145deg, #fffef5, #f5e7bb);
}

.key:nth-child(3) {
    background: linear-gradient(145deg, #fff5d4, #f0d78f);
}

.key:nth-child(4) {
    background: linear-gradient(145deg, #fffdf0, #f4dfaa);
}

.key.daisy {
    color: #d4a333;
    background: linear-gradient(145deg, #fffefa, #f8e8b8);
    font-size: clamp(21px, 6vw, 29px);
}

.key:active,
.key.pressed {
    transform: translateY(6px);
    box-shadow:
        0 1px 0 #d7bd78,
        inset 0 3px 7px rgba(150, 111, 35, 0.15);
}

.counters {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 5px;
    margin-top: 20px;
}

.counter {
    min-width: 0;
    padding: 9px 2px;
    border-radius: 12px;
    background: rgba(255,255,255,0.65);
    border: 1px solid #eee0bd;
}

.counter .letter {
    font-size: 11px;
    color: #b69f6c;
    font-weight: bold;
}

.counter .number {
    display: block;
    margin-top: 4px;
    font-size: 16px;
    color: #a47e39;
    font-weight: bold;
}

/* SWITCH SELECTOR */

.switch-panel {
    max-width: 390px;
    margin: 25px auto 18px;
    padding: 17px 15px;
    border: 1px solid #eddfbd;
    border-radius: 20px;
    background: rgba(255, 253, 245, 0.8);
    box-shadow: 0 5px 12px rgba(128, 105, 57, 0.07);
}

.switch-title {
    color: #a98a4d;
    font-size: 11px;
    font-weight: bold;
    letter-spacing: 2px;
    margin-bottom: 12px;
}

.switch-options {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 7px;
}

.switch-option {
    padding: 10px 3px;
    border: 1px solid #eadbb7;
    border-radius: 13px;
    background: #fffdf7;
    color: #9d8557;
    cursor: pointer;
    font-family: inherit;
    font-size: 11px;
    transition: 0.15s;
}

.switch-option span {
    display: block;
    font-size: 19px;
    margin-bottom: 5px;
}

.switch-option.active {
    background: #f6e6b8;
    border: 2px solid #d7b45d;
    color: #876629;
    font-weight: bold;
    box-shadow: 0 3px 0 #dfc77e;
    transform: translateY(-2px);
}

.switch-description {
    margin-top: 12px;
    color: #a9966c;
    font-size: 11px;
    min-height: 16px;
}

.total {
    margin: 22px 0 15px;
    color: #9e8657;
    font-size: 14px;
}

.total strong {
    color: #d0a344;
    font-size: 23px;
}

.controls {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
}

.control {
    border: 1px solid #e8d5a6;
    border-radius: 20px;
    padding: 9px 16px;
    background: #fffdf5;
    color: #947b4b;
    font-size: 12px;
    cursor: pointer;
}

.message {
    min-height: 25px;
    margin-top: 18px;
    color: #bd9a50;
    font-size: 13px;
    font-style: italic;
}

.footer {
    margin-top: 22px;
    font-size: 11px;
    color: #bba77c;
}

.sparkle {
    position: fixed;
    pointer-events: none;
    font-size: 17px;
    animation: floatUp 0.8s ease-out forwards;
}

@keyframes floatUp {
    from {
        opacity: 1;
        transform: translateY(0) scale(0.7);
    }
    to {
        opacity: 0;
        transform: translateY(-55px) scale(1.4);
    }
}

@media (max-width: 350px) {
    .keychain {
        padding-left: 9px;
        padding-right: 9px;
    }

    .buttons {
        gap: 5px;
    }

    .key {
        border-radius: 12px;
    }

    .switch-option {
        font-size: 10px;
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>EISE 🌼</h1>
    <p class="subtitle">a little pocket of sunshine</p>

    <div class="keychain">

        <div class="keyring"></div>

        <div class="decorations">
            <div class="hairpin"></div>
            <div class="hairpin second"></div>
        </div>

        <div class="label">✦ EISE'S LITTLE CLICKER ✦</div>

        <div class="buttons">
            <button class="key" onclick="clickButton('E', this)">E</button>
            <button class="key" onclick="clickButton('I', this)">I</button>
            <button class="key" onclick="clickButton('S', this)">S</button>
            <button class="key" onclick="clickButton('E2', this)">E</button>
            <button class="key daisy" onclick="clickButton('🌼', this)">🌼</button>
        </div>

        <div class="counters">
            <div class="counter">
                <span class="letter">E</span>
                <span class="number" id="count-E">0</span>
            </div>
            <div class="counter">
                <span class="letter">I</span>
                <span class="number" id="count-I">0</span>
            </div>
            <div class="counter">
                <span class="letter">S</span>
                <span class="number" id="count-S">0</span>
            </div>
            <div class="counter">
                <span class="letter">E</span>
                <span class="number" id="count-E2">0</span>
            </div>
            <div class="counter">
                <span class="letter">🌼</span>
                <span class="number" id="count-🌼">0</span>
            </div>
        </div>

    </div>

    <!-- MECHANICAL SWITCH OPTIONS -->

    <div class="switch-panel">

        <div class="switch-title">✦ CHOOSE YOUR SWITCH ✦</div>

        <div class="switch-options">

            <button class="switch-option active"
                id="switch-clicky"
                onclick="changeSwitch('clicky')">
                <span>⌨️</span>
                Clicky
            </button>

            <button class="switch-option"
                id="switch-tactile"
                onclick="changeSwitch('tactile')">
                <span>〰️</span>
                Tactile
            </button>

            <button class="switch-option"
                id="switch-linear"
                onclick="changeSwitch('linear')">
                <span>☁️</span>
                Linear
            </button>

        </div>

        <div class="switch-description" id="switchDescription">
            Crisp click + spring release
        </div>

    </div>

    <div class="total">
        TOTAL CLICKS<br>
        <strong id="total">0</strong>
    </div>

    <div class="controls">
        <button class="control" id="soundToggle" onclick="toggleSound()">
            🔊 Sound ON
        </button>

        <button class="control" onclick="resetCounters()">
            ↻ Reset
        </button>
    </div>

    <div class="message" id="message">
        press a button and enjoy the little clicks ♡
    </div>

    <div class="footer">
        made with a little sunshine just for Eise ☀️
    </div>

</div>

<script>
const counts = {
    E: 0,
    I: 0,
    S: 0,
    E2: 0,
    "🌼": 0
};

let total = 0;
let soundEnabled = true;
let currentSwitch = "clicky";
let audioContext;

const switchDescriptions = {
    clicky: "Crisp click + spring release",
    tactile: "Soft bump + gentle mechanical thock",
    linear: "Smooth, quiet, and buttery"
};

const messages = [
    "a little click of happiness ♡",
    "you're sunshine in a little package ☀️",
    "one daisy for you 🌼",
    "keep blooming, little flower!",
    "just a little something for you ♡",
    "pretty things for a pretty soul",
    "click, click, sunshine!",
    "hope this makes you smile 🌼"
];

/* CHANGE MECHANICAL SWITCH */

function changeSwitch(type) {
    currentSwitch = type;

    document.querySelectorAll(".switch-option").forEach(button => {
        button.classList.remove("active");
    });

    document.getElementById("switch-" + type)
        .classList.add("active");

    document.getElementById("switchDescription")
        .textContent = switchDescriptions[type];

    document.getElementById("message").textContent =
        type === "clicky" ? "let's hear those crisp clicks! ♡" :
        type === "tactile" ? "a little bump with every press 🌼" :
        "smooth and soft, just like a cloud ☁️";

    // Play a sample so the user can hear the new switch
    playMechanicalSound();
}

/* AUDIO SETUP */

function getAudio() {
    if (!audioContext) {
        audioContext = new (
            window.AudioContext || window.webkitAudioContext
        )();
    }

    if (audioContext.state === "suspended") {
        audioContext.resume();
    }

    return audioContext;
}

/* SOUND GENERATOR */

function makeImpact(ctx, time, settings) {
    const duration = settings.duration || 0.05;
    const size = Math.floor(ctx.sampleRate * duration);

    const buffer = ctx.createBuffer(
        1, size, ctx.sampleRate
    );

    const data = buffer.getChannelData(0);

    for (let i = 0; i < size; i++) {
        const fade = Math.pow(1 - i / size, settings.fade || 3);
        data[i] = (Math.random() * 2 - 1) * fade;
    }

    const noise = ctx.createBufferSource();
    noise.buffer = buffer;

    const filter = ctx.createBiquadFilter();
    filter.type = settings.filterType || "highpass";
    filter.frequency.value = settings.filter || 1600;

    const noiseGain = ctx.createGain();
    noiseGain.gain.setValueAtTime(settings.volume, time);
    noiseGain.gain.exponentialRampToValueAtTime(
        0.001, time + duration
    );

    noise.connect(filter);
    filter.connect(noiseGain);
    noiseGain.connect(ctx.destination);

    noise.start(time);
    noise.stop(time + duration);

    if (settings.frequency) {
        const oscillator = ctx.createOscillator();
        const oscGain = ctx.createGain();

        oscillator.type = settings.wave || "triangle";
        oscillator.frequency.setValueAtTime(
            settings.frequency, time
        );

        oscillator.frequency.exponentialRampToValueAtTime(
            settings.frequency * (settings.pitchEnd || 0.5),
            time + duration
        );

        oscGain.gain.setValueAtTime(
            settings.volume * (settings.toneVolume || 0.6),
            time
        );

        oscGain.gain.exponentialRampToValueAtTime(
            0.001, time + duration
        );

        oscillator.connect(oscGain);
        oscGain.connect(ctx.destination);

        oscillator.start(time);
        oscillator.stop(time + duration);
    }
}

/* THREE DIFFERENT SWITCH SOUNDS */

function playMechanicalSound() {
    if (!soundEnabled) return;

    try {
        const ctx = getAudio();
        const now = ctx.currentTime;

        if (currentSwitch === "clicky") {

            // Sharp mechanical click
            makeImpact(ctx, now, {
                volume: 0.8,
                frequency: 850,
                filter: 1800,
                duration: 0.045,
                toneVolume: 0.7
            });

            // Spring release clack
            makeImpact(ctx, now + 0.055, {
                volume: 0.35,
                frequency: 1250,
                filter: 2200,
                duration: 0.04,
                toneVolume: 0.5
            });

        } else if (currentSwitch === "tactile") {

            // Deeper, softer bump
            makeImpact(ctx, now, {
                volume: 0.5,
                frequency: 280,
                filter: 650,
                filterType: "lowpass",
                duration: 0.065,
                toneVolume: 0.9,
                fade: 2
            });

            // Subtle mechanical return
            makeImpact(ctx, now + 0.045, {
                volume: 0.15,
                frequency: 420,
                filter: 900,
                filterType: "lowpass",
                duration: 0.045,
                toneVolume: 0.5
            });

        } else if (currentSwitch === "linear") {

            // Smooth, muted press
            makeImpact(ctx, now, {
                volume: 0.25,
                frequency: 180,
                filter: 450,
                filterType: "lowpass",
                duration: 0.085,
                toneVolume: 0.8,
                fade: 2
            });

        }

    } catch (error) {
        console.log("Audio unavailable", error);
    }
}

/* BUTTON INTERACTION */

function clickButton(type, button) {
    counts[type]++;
    total++;

    document.getElementById("count-" + type).textContent =
        counts[type];

    document.getElementById("total").textContent = total;

    playMechanicalSound();

    button.classList.add("pressed");

    setTimeout(() => {
        button.classList.remove("pressed");
    }, 110);

    createSparkle(button);

    if (type === "🌼") {
        document.getElementById("message").textContent =
            "a daisy just for you, Eise 🌼";
    } else {
        const randomMessage =
            messages[Math.floor(Math.random() * messages.length)];

        document.getElementById("message").textContent =
            randomMessage;
    }
}

/* SPARKLE EFFECT */

function createSparkle(button) {
    const rect = button.getBoundingClientRect();
    const sparkle = document.createElement("div");

    sparkle.className = "sparkle";

    sparkle.textContent = ["✨", "🌼", "⭐", "♡"][
        Math.floor(Math.random() * 4)
    ];

    sparkle.style.left =
        rect.left + rect.width / 2 + "px";

    sparkle.style.top = rect.top + "px";

    document.body.appendChild(sparkle);

    setTimeout(() => sparkle.remove(), 800);
}

/* SOUND TOGGLE */

function toggleSound() {
    soundEnabled = !soundEnabled;

    document.getElementById("soundToggle").textContent =
        soundEnabled ? "🔊 Sound ON" : "🔇 Sound OFF";
}

/* RESET */

function resetCounters() {
    for (const key in counts) {
        counts[key] = 0;

        document.getElementById("count-" + key).textContent = 0;
    }

    total = 0;

    document.getElementById("total").textContent = 0;

    document.getElementById("message").textContent =
        "fresh start, little sunshine 🌼";
}
</script>

</body>
</html>
