<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EISE Clicker 🌼</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px 15px;
    font-family: "Trebuchet MS", sans-serif;
    background: linear-gradient(145deg, #fffdf0, #fff2bd, #fff9df);
    color: #80652d;
}

.container {
    width: 100%;
    max-width: 440px;
    text-align: center;
}

h1 {
    margin-bottom: 5px;
    color: #c99c32;
    font-size: 29px;
}

.subtitle {
    color: #a58a51;
    font-size: 13px;
    margin-bottom: 28px;
}

/* KEYCHAIN */

.keychain {
    position: relative;
    width: 100%;
    max-width: 370px;
    margin: 0 auto 25px;
    padding: 30px 18px 25px;
    background: linear-gradient(145deg, #fffef7, #fff4c9);
    border: 4px solid #e9c75d;
    border-radius: 32px;
    box-shadow:
        0 10px 0 #d6ad42,
        0 16px 25px rgba(147, 111, 30, 0.18);
}

/* METAL KEYRING */

.keyring {
    position: absolute;
    width: 48px;
    height: 48px;
    border: 7px solid #c8c8c8;
    border-radius: 50%;
    top: -30px;
    left: 50%;
    transform: translateX(-50%);
    background: transparent;
    box-shadow:
        inset 2px 2px 3px white,
        2px 3px 4px rgba(0,0,0,0.15);
}

.keyring::after {
    content: "";
    position: absolute;
    width: 18px;
    height: 18px;
    border: 4px solid #dedede;
    border-radius: 50%;
    top: 8px;
    left: 8px;
}

/* DECORATIONS */

.decorations {
    position: absolute;
    inset: 0;
    pointer-events: none;
}

.hairpin {
    position: absolute;
    width: 42px;
    height: 7px;
    border-radius: 10px;
    background: linear-gradient(#f4d879, #d7aa3c);
    box-shadow: 0 2px 3px rgba(0,0,0,0.12);
}

.hairpin.one {
    top: 15px;
    left: 17px;
    transform: rotate(-35deg);
}

.hairpin.one::after {
    content: "";
    position: absolute;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #fff;
    border: 2px solid #e5c65d;
    right: -4px;
    top: -3px;
}

.hairpin.two {
    top: 26px;
    right: 17px;
    transform: rotate(35deg);
    background: linear-gradient(#fff7d9, #e9d59a);
}

.hairpin.two::after {
    content: "🌼";
    position: absolute;
    right: -12px;
    top: -13px;
    font-size: 17px;
}

/* BUTTONS */

.buttons {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    margin-top: 28px;
}

.key {
    min-width: 0;
}

.key-button {
    width: 100%;
    aspect-ratio: 1 / 1;
    border: 2px solid #e6c65c;
    border-radius: 15px;
    background: linear-gradient(145deg, #fffef5, #ffeaa3);
    color: #a77b22;
    font-size: clamp(19px, 5vw, 25px);
    font-weight: bold;
    box-shadow:
        0 5px 0 #d6ae48,
        0 7px 8px rgba(145, 109, 27, 0.15);
    cursor: pointer;
    transition: transform 0.08s, box-shadow 0.08s;
    -webkit-tap-highlight-color: transparent;
}

.key-button:active {
    transform: translateY(5px);
    box-shadow:
        0 0 0 #d6ae48,
        0 2px 4px rgba(145, 109, 27, 0.15);
}

.counter {
    margin-top: 10px;
    font-size: 12px;
    font-weight: bold;
    color: #a58a51;
}

/* TOTAL COUNTER */

.total {
    margin-top: 30px;
    padding: 13px;
    border-radius: 16px;
    background: rgba(255,255,255,0.6);
    border: 1px solid #f0dfa8;
    font-size: 14px;
}

.total span {
    font-weight: bold;
    color: #c3942d;
    font-size: 20px;
}

/* SWITCH SELECTOR */

.switch-panel {
    margin-top: 28px;
    padding: 18px;
    border-radius: 20px;
    background: rgba(255,255,255,0.65);
    border: 1px solid #f0dfa8;
}

.switch-panel h3 {
    margin: 0 0 12px;
    font-size: 15px;
    color: #a17d35;
}

.switch-options {
    display: flex;
    justify-content: center;
    gap: 8px;
}

.switch-options button {
    flex: 1;
    padding: 10px 5px;
    border: 1px solid #e8d18a;
    border-radius: 12px;
    background: #fffdf3;
    color: #9a7b3d;
    font-size: 12px;
    cursor: pointer;
}

.switch-options button.active {
    background: #f6df91;
    border-color: #d9b84f;
    color: #76571b;
    font-weight: bold;
}

.switch-description {
    margin: 12px 0 0;
    min-height: 32px;
    font-size: 12px;
    line-height: 1.5;
    color: #a58a51;
}

/* CONTROLS */

.controls {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-top: 18px;
}

.control-button {
    padding: 10px 16px;
    border: 1px solid #e8d18a;
    border-radius: 20px;
    background: #fffdf3;
    color: #967333;
    font-size: 12px;
    cursor: pointer;
}

.message {
    margin-top: 22px;
    min-height: 22px;
    color: #c49a3e;
    font-size: 13px;
    font-style: italic;
}

.footer {
    margin-top: 25px;
    font-size: 11px;
    color: #b5a171;
}

/* SPARKLES */

.sparkle {
    position: fixed;
    pointer-events: none;
    animation: sparkle 0.8s ease-out forwards;
    font-size: 17px;
    z-index: 10;
}

@keyframes sparkle {
    0% {
        opacity: 1;
        transform: translateY(0) scale(0.5) rotate(0deg);
    }
    100% {
        opacity: 0;
        transform: translateY(-55px) scale(1.4) rotate(45deg);
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>EISE Clicker 🌼</h1>
    <p class="subtitle">A little click of happiness, just for you ♡</p>

    <div class="keychain">

        <div class="keyring"></div>

        <div class="decorations">
            <div class="hairpin one"></div>
            <div class="hairpin two"></div>
        </div>

        <div class="buttons">

            <div class="key">
                <button class="key-button" onclick="clickKey('E', this)">E</button>
                <div class="counter" id="count-E">0</div>
            </div>

            <div class="key">
                <button class="key-button" onclick="clickKey('I', this)">I</button>
                <div class="counter" id="count-I">0</div>
            </div>

            <div class="key">
                <button class="key-button" onclick="clickKey('S', this)">S</button>
                <div class="counter" id="count-S">0</div>
            </div>

            <div class="key">
                <button class="key-button" onclick="clickKey('E2', this)">E</button>
                <div class="counter" id="count-E2">0</div>
            </div>

            <div class="key">
                <button class="key-button" onclick="clickKey('🌼', this)">🌼</button>
                <div class="counter" id="count-🌼">0</div>
            </div>

        </div>

    </div>

    <div class="total">
        Total clicks: <span id="total">0</span>
    </div>

    <div class="switch-panel">

        <h3>Choose your switch ♡</h3>

        <div class="switch-options">
            <button id="clicky" class="active" onclick="changeSwitch('clicky')">
                Clicky
            </button>

            <button id="tactile" onclick="changeSwitch('tactile')">
                Tactile
            </button>

            <button id="linear" onclick="changeSwitch('linear')">
                Linear
            </button>
        </div>

        <p class="switch-description" id="switch-description">
            Crisp and satisfying mechanical clicks!
        </p>

    </div>

    <div class="controls">
        <button class="control-button" onclick="toggleSound()" id="sound-button">
            🔊 Sound On
        </button>

        <button class="control-button" onclick="resetCounters()">
            ↻ Reset
        </button>
    </div>

    <div class="message" id="message">
        You're blooming beautifully 🌼
    </div>

    <div class="footer">
        Made with love ♡
    </div>

</div>

<script>
/* COUNTERS */

const counts = {
    E: 0,
    I: 0,
    S: 0,
    E2: 0,
    "🌼": 0
};

let totalClicks = 0;
let soundEnabled = true;
let currentSwitch = "clicky";

const messages = [
    "You're blooming beautifully 🌼",
    "Keep shining, sunshine ☀️",
    "A little click, a little happiness ♡",
    "You make the world brighter!",
    "Sending you a pocketful of daisies 🌼",
    "Don't forget to smile today!",
    "You're one of a kind ♡"
];

function clickKey(key, button) {

    counts[key]++;
    totalClicks++;

    document.getElementById("count-" + key).textContent = counts[key];
    document.getElementById("total").textContent = totalClicks;

    playMechanicalSound();
    createSparkle(button);

    if (totalClicks % 5 === 0) {
        showMessage();
    }
}

/* MESSAGES */

function showMessage() {
    const random = Math.floor(Math.random() * messages.length);
    document.getElementById("message").textContent = messages[random];
}

/* SPARKLES */

function createSparkle(button) {

    const rect = button.getBoundingClientRect();

    const sparkle = document.createElement("div");
    sparkle.className = "sparkle";
    sparkle.textContent = Math.random() > 0.5 ? "✨" : "🌼";

    sparkle.style.left = (
        rect.left + rect.width / 2
    ) + "px";

    sparkle.style.top = rect.top + "px";

    document.body.appendChild(sparkle);

    setTimeout(() => {
        sparkle.remove();
    }, 800);
}

/* AUDIO */

let audioContext = null;

function getAudio() {

    if (!audioContext) {
        audioContext = new (
            window.AudioContext || window.webkitAudioContext
        )();
    }

    if (audioContext.state === "suspended") {
        audioContext.resume();
    }

    return audioContext;
}

/* MECHANICAL IMPACT SOUND */

function makeImpact(ctx, time, settings) {

    const duration = settings.duration || 0.05;
    const size = Math.floor(ctx.sampleRate * duration);

    const buffer = ctx.createBuffer(1, size, ctx.sampleRate);
    const data = buffer.getChannelData(0);

    for (let i = 0; i < size; i++) {

        const fade = Math.pow(
            1 - i / size,
            settings.fade || 3
        );

        data[i] = (Math.random() * 2 - 1) * fade;
    }

    const noise = ctx.createBufferSource();
    noise.buffer = buffer;

    const filter = ctx.createBiquadFilter();
    filter.type = settings.filterType || "highpass";
    filter.frequency.value = settings.filter || 1600;

    const noiseGain = ctx.createGain();

    noiseGain.gain.setValueAtTime(settings.volume, time);

    noiseGain.gain.exponentialRampToValueAtTime(
        0.001,
        time + duration
    );

    noise.connect(filter);
    filter.connect(noiseGain);
    noiseGain.connect(ctx.destination);

    noise.start(time);
    noise.stop(time + duration);

    if (settings.frequency) {

        const oscillator = ctx.createOscillator();
        const oscGain = ctx.createGain();

        oscillator.type = settings.wave || "triangle";

        oscillator.frequency.setValueAtTime(
            settings.frequency,
            time
        );

        oscillator.frequency.exponentialRampToValueAtTime(
            settings.frequency * (settings.pitchEnd || 0.5),
            time + duration
        );

        oscGain.gain.setValueAtTime(
            settings.volume * (settings.toneVolume || 0.6),
            time
        );

        oscGain.gain.exponentialRampToValueAtTime(
            0.001,
            time + duration
        );

        oscillator.connect(oscGain);
        oscGain.connect(ctx.destination);

        oscillator.start(time);
        oscillator.stop(time + duration);
    }
}

/* SWITCH SOUND PROFILES */

function playMechanicalSound() {

    if (!soundEnabled) return;

    try {

        const ctx = getAudio();
        const now = ctx.currentTime;

        if (currentSwitch === "clicky") {

            // Original crisp mechanical click
            makeImpact(ctx, now, {
                volume: 0.8,
                frequency: 850,
                filter: 1800,
                duration: 0.045,
                toneVolume: 0.7
            });

            // Spring release clack
            makeImpact(ctx, now + 0.055, {
                volume: 0.35,
                frequency: 1250,
                filter: 2200,
                duration: 0.04,
                toneVolume: 0.5
            });

        } else if (currentSwitch === "tactile") {

            // Soft, rounded mechanical tap
            makeImpact(ctx, now, {
                volume: 0.20,
                frequency: 650,
                filter: 2400,
                filterType: "highpass",
                duration: 0.035,
                toneVolume: 0.45,
                pitchEnd: 0.8,
                fade: 4
            });

            // Delicate high-pitched tick
            makeImpact(ctx, now + 0.035, {
                volume: 0.09,
                frequency: 1450,
                filter: 3200,
                duration: 0.025,
                toneVolume: 0.35,
                pitchEnd: 0.9,
                fade: 5
            });

        } else if (currentSwitch === "linear") {

            // Very light, muted key press
            makeImpact(ctx, now, {
                volume: 0.12,
                frequency: 900,
                filter: 2800,
                duration: 0.045,
                toneVolume: 0.3,
                pitchEnd: 0.85,
                fade: 4
            });

            // Airy, dreamy chime
            const chime = ctx.createOscillator();
            const chimeGain = ctx.createGain();

            chime.type = "sine";

            chime.frequency.setValueAtTime(
                1760,
                now + 0.025
            );

            chime.frequency.exponentialRampToValueAtTime(
                1320,
                now + 0.22
            );

            chimeGain.gain.setValueAtTime(
                0.0001,
                now + 0.025
            );

            chimeGain.gain.linearRampToValueAtTime(
                0.045,
                now + 0.045
            );

            chimeGain.gain.exponentialRampToValueAtTime(
                0.0001,
                now + 0.25
            );

            chime.connect(chimeGain);
            chimeGain.connect(ctx.destination);

            chime.start(now + 0.025);
            chime.stop(now + 0.26);
        }

    } catch (error) {
        console.log("Audio unavailable", error);
    }
}

/* SWITCH SELECTION */

const switchDescriptions = {

    clicky: "Crisp and satisfying mechanical clicks!",

    tactile: "A soft, rounded tap with a delicate little tick ♡",

    linear: "A gentle, dreamy press with a soft airy chime ✨"
};

function changeSwitch(type) {

    currentSwitch = type;

    document.querySelectorAll(".switch-options button")
        .forEach(button => button.classList.remove("active"));

    document.getElementById(type).classList.add("active");

    document.getElementById("switch-description").textContent =
        switchDescriptions[type];

    // Play a sample of the selected switch
    playMechanicalSound();
}

/* SOUND TOGGLE */

function toggleSound() {

    soundEnabled = !soundEnabled;

    document.getElementById("sound-button").textContent =
        soundEnabled ? "🔊 Sound On" : "🔇 Sound Off";

    if (soundEnabled) {
        getAudio();
        playMechanicalSound();
    }
}

/* RESET */

function resetCounters() {

    Object.keys(counts).forEach(key => {

        counts[key] = 0;

        document.getElementById("count-" + key).textContent = 0;
    });

    totalClicks = 0;

    document.getElementById("total").textContent = 0;

    document.getElementById("message").textContent =
        "A fresh start! Keep blooming 🌼";
}

</script>

</body>
</html>
